# style name or JSON path (default "auto")
# glow won't expand $HOME/~ here, so the monokai theme is applied by the glow()
# wrapper in cli/zsh/.zshrc.functions, which passes --style with $HOME expanded.
style: "auto"
# mouse support (TUI-mode only)
mouse: false
# use pager to display markdown
pager: true
# word-wrap at width
width: 120
# show all files, including hidden and ignored.
all: false
